services:
  mongodb:
    image: mongo:7
    container_name: disaster-management-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  python-ai:
    build:
      context: .
      dockerfile: python-ai/Dockerfile
    container_name: disaster-management-python-ai
    restart: unless-stopped
    ports:
      - '8000:8000'

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: disaster-management-backend
    restart: unless-stopped
    depends_on:
      - mongodb
      - python-ai
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/smart-logistics-platform
      MONGODB_URI: mongodb://mongodb:27017/smart-logistics-platform
      FRONTEND_URL: http://frontend
      PYTHON_AI_URL: http://python-ai:8000
    ports:
      - '5000:5000'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: disaster-management-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3000:80'

volumes:
  mongodb_data: